# Dashboard "Дача" for the Victor remote node.
# Create: Settings -> Dashboards -> Add dashboard -> "New dashboard from scratch",
# open it -> ⋮ -> Edit -> ⋮ -> Raw configuration editor -> paste this file.
#
# HACS frontend cards used (open source):
#   - slipx06/sunsynk-power-flow-card  (power flow, has a PowMr model)
#   - Pho3niX90/jk-bms-card            (JK BMS screen, prefix victor_bms)
# Everything else is built into Home Assistant.
#
# Replace ADMIN_USER_ID (Settings -> People -> Users -> your user, the id is in the URL)
# so the "Налаштування" view is visible only to you.
# Set battery.energy (Wh) to the remote battery size.
#
# The power-flow card config follows aver-ua/esphome-hybrid-inverter-2341
# examples/lovelace-powmr.yaml (Apache-2.0), with entities renamed to this node.

title: Дача
views:
  - title: Дача
    path: dacha
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Зараз
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.victor_controller_status
                state_not: "on"
            card:
              type: markdown
              content: >
                <ha-alert alert-type="warning">Блок на дачі не на зв'язку, дані можуть бути застарілі.</ha-alert>
          - type: custom:sunsynk-power-flow-card
            cardstyle: lite
            show_solar: true
            show_battery: true
            show_grid: true
            decimal_places: 2
            inverter:
              model: powmr
              modern: false
              autarky: power
              auto_scale: true
            battery:
              energy: 10240          # Wh, set to the real battery size
              shutdown_soc: 10
              show_daily: true
              invert_power: true
              show_absolute: true
            solar:
              show_daily: true
              mppts: 1
              max_power: 6500
              pv1_name: Сонце
            load:
              show_daily: true
              auto_scale: true
            grid:
              grid_name: Мережа
              show_daily_buy: true
              show_nonessential: false
              auto_scale: true
            entities:
              inverter_voltage_154: sensor.victor_load_voltage
              inverter_current_164: sensor.victor_load_current
              inverter_power_175: sensor.victor_load_power
              load_frequency_192: sensor.victor_load_frequency
              grid_connected_status_194: binary_sensor.victor_grid_active
              grid_ct_power_172: sensor.victor_grid_power_estimated
              day_grid_import_76: sensor.victor_grid_daily_energy_estimated
              day_load_energy_84: sensor.victor_daily_energy
              battery_voltage_183: sensor.victor_bms_total_voltage
              battery_soc_184: sensor.victor_bms_state_of_charge
              battery_power_190: sensor.victor_bms_power
              battery_current_191: sensor.victor_bms_current
              battery_temp_182: sensor.victor_bms_temperature_sensor_1
              day_battery_charge_70: sensor.victor_bms_daily_charge_energy
              day_battery_discharge_71: sensor.victor_bms_daily_discharge_energy
              pv1_power_186: sensor.victor_pv_power
              pv1_voltage_109: sensor.victor_pv_voltage
              pv1_current_110: sensor.victor_pv_current
              day_pv_energy_108: sensor.victor_pv_daily_energy
          - type: tile
            entity: sensor.victor_working_state
            name: Режим
          - type: tile
            entity: sensor.victor_bms_state_of_charge
            name: Батарея
          - type: tile
            entity: sensor.victor_rules_last_action
            name: Автоматика

      - type: grid
        cards:
          - type: heading
            heading: Енергія по днях
          - type: statistics-graph
            title: Вироблено і спожито, кВт·год
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types: [change]
            entities:
              - entity: sensor.victor_pv_daily_energy
                name: Сонце
              - entity: sensor.victor_grid_daily_energy_estimated
                name: З мережі (оцінка)
              - entity: sensor.victor_daily_energy
                name: Спожито
          - type: statistics-graph
            title: Батарея, кВт·год
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types: [change]
            entities:
              - entity: sensor.victor_bms_daily_charge_energy
                name: Заряд
              - entity: sensor.victor_bms_daily_discharge_energy
                name: Розряд
          - type: statistics-graph
            title: По місяцях, кВт·год
            chart_type: bar
            period: month
            days_to_show: 365
            stat_types: [change]
            entities:
              - entity: sensor.victor_pv_daily_energy
                name: Сонце
              - entity: sensor.victor_grid_daily_energy_estimated
                name: З мережі (оцінка)
              - entity: sensor.victor_daily_energy
                name: Спожито

      - type: grid
        cards:
          - type: heading
            heading: Батарея
          - type: custom:jk-bms-card
            prefix: victor_bms
            cellCount: 16

      - type: grid
        cards:
          - type: heading
            heading: Що відбувалось
          - type: history-graph
            title: Режими за 48 год
            hours_to_show: 48
            entities:
              - entity: binary_sensor.victor_grid_active
                name: Мережа
              - entity: sensor.victor_working_state
                name: Режим інвертора
              - entity: sensor.victor_output_source_priority
                name: Пріоритет виходу
              - entity: sensor.victor_charger_source_priority
                name: Джерело заряду
              - entity: sensor.victor_max_utility_charging_current
                name: Струм заряду від мережі
          - type: history-graph
            title: Потужності за 24 год
            hours_to_show: 24
            entities:
              - entity: sensor.victor_pv_power
                name: Сонце
              - entity: sensor.victor_load_power
                name: Навантаження
              - entity: sensor.victor_grid_power_estimated
                name: Мережа (оцінка)
              - entity: sensor.victor_bms_power
                name: Батарея
          - type: logbook
            title: Журнал змін
            hours_to_show: 72
            target:
              entity_id:
                - select.victor_output_source_priority
                - select.victor_charger_source_priority
                - select.victor_utility_charge_current
                - select.victor_max_total_charge_current
                - switch.victor_rule_grid_charge_current_by_soc
                - switch.victor_rule_grid_backup_on_low_soc
                - sensor.victor_rules_last_action
                - sensor.victor_working_state

      - type: grid
        cards:
          - type: heading
            heading: Керування
          - type: tile
            entity: select.victor_output_source_priority
            name: Пріоритет виходу
            features_position: bottom
            features:
              - type: select-options
          - type: tile
            entity: select.victor_charger_source_priority
            name: Джерело заряду
            features_position: bottom
            features:
              - type: select-options
          - type: tile
            entity: select.victor_utility_charge_current
            name: Струм заряду від мережі, А
            features_position: bottom
            features:
              - type: select-options
          - type: tile
            entity: select.victor_max_total_charge_current
            name: Загальний струм заряду, А
            features_position: bottom
            features:
              - type: select-options

      - type: grid
        cards:
          - type: heading
            heading: Автоматика на блоці
          - type: markdown
            content: >
              Правила виконуються на самому блоці й працюють без інтернету.
              Поки правило «мережа при низькому заряді» увімкнене і спрацювало,
              ручні зміни пріоритетів воно поверне назад.
          - type: entities
            entities:
              - entity: switch.victor_rule_grid_charge_current_by_soc
                name: Струм заряду від мережі за SOC
              - entity: number.victor_rule_soc_low
                name: Нижній поріг SOC
              - entity: number.victor_rule_soc_high
                name: Верхній поріг SOC
              - entity: number.victor_rule_current_below_low
                name: Струм нижче нижнього, А
              - entity: number.victor_rule_current_between
                name: Струм між порогами, А
              - entity: number.victor_rule_current_above_high
                name: Струм вище верхнього, А
          - type: entities
            entities:
              - entity: switch.victor_rule_grid_backup_on_low_soc
                name: Мережа при низькому заряді
              - entity: number.victor_rule_grid_backup_on_at_soc
                name: Увімкнути при SOC
              - entity: number.victor_rule_grid_backup_off_at_soc
                name: Вимкнути при SOC
              - entity: select.victor_rule_normal_output_priority
                name: Звичайний пріоритет виходу
              - entity: select.victor_rule_normal_charger_priority
                name: Звичайне джерело заряду

  - title: Налаштування
    path: dacha-admin
    icon: mdi:cog
    type: sections
    visible:
      - user: ADMIN_USER_ID
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Інвертор (зміни пишуться в EEPROM)
          - type: entities
            entities:
              - number.victor_back_to_utility_source_voltage
              - number.victor_back_to_battery_source_voltage
              - number.victor_bulk_charging_voltage
              - number.victor_floating_charging_voltage
              - number.victor_low_dc_cut_off_voltage
              - select.victor_battery_type
              - select.victor_ac_input_voltage_range
              - select.victor_buzzer_alarm
              - sensor.victor_errors
              - sensor.victor_alarms
              - binary_sensor.victor_inverter_link
      - type: grid
        cards:
          - type: heading
            heading: BMS
          - type: entities
            entities:
              - binary_sensor.victor_bms_online_status
              - switch.victor_bms_bluetooth_connection
              - switch.victor_bms_charging
              - switch.victor_bms_discharging
              - switch.victor_bms_balancer
              - text.victor_bms_mac
              - sensor.victor_bms_found_devices
              - sensor.victor_bms_errors
              - sensor.victor_bms_device_model
              - sensor.victor_bms_hardware_version
              - sensor.victor_bms_charging_cycles
      - type: grid
        cards:
          - type: heading
            heading: BMS налаштування
          - type: markdown
            content: >
              Тут основні. Усі 45 параметрів і 17 перемикачів JK:
              Settings → Devices → Victor → Configuration.
              Після зміни натисни «Retrieve Settings», щоб перечитати значення з BMS.
          - type: entities
            entities:
              - button.victor_bms_retrieve_settings
              - number.victor_bms_max_charge_current
              - number.victor_bms_max_discharge_current
              - number.victor_bms_max_balance_current
              - number.victor_bms_balancing_start_voltage
              - number.victor_bms_balance_trigger_voltage
              - number.victor_bms_cell_voltage_overvoltage_protection
              - number.victor_bms_cell_voltage_overvoltage_recovery
              - number.victor_bms_cell_voltage_undervoltage_protection
              - number.victor_bms_cell_voltage_undervoltage_recovery
              - number.victor_bms_cell_soc100_voltage
              - number.victor_bms_cell_soc0_voltage
              - number.victor_bms_total_battery_capacity
              - switch.victor_bms_heating
              - switch.victor_bms_emergency
      - type: grid
        cards:
          - type: heading
            heading: Блок
          - type: entities
            entities:
              - binary_sensor.victor_controller_status
              - sensor.victor_firmware_version
              - sensor.victor_connected_ssid
              - sensor.victor_rssi
              - sensor.victor_uptime_hr
              - sensor.victor_heap_free
              - text.victor_ota_url
              - text.victor_ota_md5
              - button.victor_flash_firmware_from_url
              - button.victor_restart_esp
