# Test bench configuration: the same hardware and cloud path as the production node,
# talking to a Voltronic PI30 inverter and a JK BMS. Proves wiring, MAX3232, MQTT bridge,
# BLE and remote OTA before the box is deployed.
#
# Uses the same node name and MQTT prefix as victor.yaml on purpose, so the
# Home Assistant side (bridge, dashboard) is exercised end to end.
# Before deploying to a Modbus inverter, flash victor.yaml (Modbus 2341) over this one.

substitutions:
  node_name: victor
  friendly_name: Victor
  area: "СЕС"
  board: esp32dev
  led_pin: GPIO2

  mqtt_prefix: victor/node
  discovery_prefix: victor/ha
  mqtt_log_level: WARN

  inverter_tx_pin: GPIO16
  inverter_rx_pin: GPIO17
  update_interval: 15s

  # Test JK BMS. Note: a JK BMS accepts only one BLE connection at a time.
  bms_default_mac: "C8:47:80:1D:0C:E3"
  jk_bms_source: github://syssi/esphome-jk-bms@59c994e726c34b123e43eb0090736fd94706f0db
  bms_protocol: JK02_32S
  bms_throttle: 10s

packages:
  base: !include packages/base.yaml
  mqtt: !include packages/mqtt-flespi.yaml
  ota_remote: !include packages/ota-remote.yaml
  status_led: !include packages/status-led.yaml
  inverter: !include packages/inverter-pi30.yaml
  bms: !include packages/bms-jk-ble.yaml
