# JK BMS over Bluetooth via syssi/esphome-jk-bms (Apache-2.0), pinned commit.
#
# The BMS MAC can be changed at runtime from Home Assistant ("BMS MAC" text),
# so the node can be shipped without knowing the remote BMS address:
#   1. the node scans and lists nearby JK BMS in "BMS Found Devices";
#   2. paste one MAC into "BMS MAC" -> the node reconnects to it and keeps it
#      across reboots.
#
# Entity names keep syssi's defaults behind a "BMS " prefix (sensor.victor_bms_total_voltage,
# sensor.victor_bms_cell_voltage_1 ...), which is what jk-bms-card expects (prefix: victor_bms).
#
# Every setting the component can write for JK02_32S is exposed (numbers and
# switches, entity_category config), so the BMS can be tuned from Home Assistant
# without the JK app. Values are only read back after the BMS sends its settings
# frame (on connect, or via "BMS Retrieve Settings").
#
# Expects substitutions: jk_bms_source, bms_default_mac, bms_protocol, bms_throttle.

packages:
  ble_common: !include bms-ble-common.yaml
  connect_buttons: !include bms-connect-buttons-single.yaml

external_components:
  # Default (set in the main config): github://syssi/esphome-jk-bms@<commit>.
  # Offline/slow-git builds can point it at an unpacked tarball:
  #   esphome -s jk_bms_source ../tools/ref/jk-src/components compile victor.yaml
  - source: ${jk_bms_source}
    components: [jk_bms_ble]

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: bms_apply_mac

ble_client:
  - id: bms_client
    mac_address: ${bms_default_mac}

jk_bms_ble:
  - id: bms0
    ble_client_id: bms_client
    protocol_version: ${bms_protocol}
    throttle: ${bms_throttle}

script:
  - id: bms_apply_mac
    mode: queued
    then:
      - lambda: |-
          const std::string &s = id(bms_mac).state;
          uint64_t mac = 0;
          int digits = 0;
          for (char c : s) {
            int v;
            if (c >= '0' && c <= '9') v = c - '0';
            else if (c >= 'a' && c <= 'f') v = c - 'a' + 10;
            else if (c >= 'A' && c <= 'F') v = c - 'A' + 10;
            else continue;
            mac = (mac << 4) | v;
            digits++;
          }
          if (digits != 12) {
            ESP_LOGI("bms", "BMS MAC not set at runtime, using firmware default");
            return;
          }
          ESP_LOGW("bms", "Switching BMS to %s", s.c_str());
          id(bms_client).set_enabled(false);
          id(bms_client).set_address(mac);
          id(bms_client).set_enabled(true);

text:
  - platform: template
    id: bms_mac
    name: "BMS MAC"
    icon: mdi:bluetooth-settings
    entity_category: config
    mode: text
    min_length: 0
    max_length: 17
    optimistic: true
    restore_value: true
    initial_value: ""
    on_value:
      - script.execute: bms_apply_mac

