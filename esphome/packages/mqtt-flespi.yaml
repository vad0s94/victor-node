# MQTT over TLS to flespi (mqtt.flespi.io:8883).
# The node publishes under victor/node/... and its Home Assistant discovery
# under victor/ha/...; the home Mosquitto bridge maps victor/ha/... back to
# homeassistant/... (see mosquitto/flespi-bridge.conf).
#
# CA bundle: GlobalSign Root CA - R6 (valid to 2034) + GlobalSign Root CA R1
# (valid to 2028). flespi's chain: *.flespi.io <- AlphaSSL CA 2025 <- R6 (cross-signed by R1).
# Regenerate with: tools/update-flespi-ca.sh

mqtt:
  id: mqtt_client
  broker: mqtt.flespi.io
  port: 8883
  username: !secret flespi_token
  password: ""
  client_id: ${node_name}-node
  topic_prefix: ${mqtt_prefix}
  discovery: true
  discovery_prefix: ${discovery_prefix}
  discovery_retain: true
  discovery_unique_id_generator: mac
  discovery_object_id_generator: device_name
  log_topic:
    topic: ${mqtt_prefix}/debug
    level: ${mqtt_log_level}
  keepalive: 30s
  reboot_timeout: 60min
  certificate_authority: |
