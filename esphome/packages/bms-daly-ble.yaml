# Daly BMS over Bluetooth via syssi/esphome-daly-bms (Apache-2.0), pinned commit.
#
# The BMS MAC can be changed at runtime from Home Assistant ("BMS MAC" text):
#   1. the node scans and lists nearby devices in "BMS Found Devices";
#   2. paste one MAC into "BMS MAC" -> the node reconnects and stores it across reboots.
#
# Expects substitutions: daly_bms_source, bms_default_mac, bms_password,
# bms_status_registers, bms_throttle.

packages:
  ble_common: !include bms-ble-common.yaml
  connect_buttons: !include bms-connect-buttons-single.yaml

external_components:
  - source: ${daly_bms_source}
    components: [daly_bms_ble]

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: bms_apply_mac

ble_client:
  - id: bms_client
    mac_address: ${bms_default_mac}

daly_bms_ble:
  - id: bms0
    ble_client_id: bms_client
    password: ${bms_password}
    status_registers: ${bms_status_registers}
    update_interval: ${bms_throttle}

script:
  - id: bms_apply_mac
    mode: queued
    then:
      - lambda: |-
          const std::string &s = id(bms_mac).state;
          uint64_t mac = 0;
          int digits = 0;
          for (char c : s) {
            int v;
            if (c >= '0' && c <= '9') v = c - '0';
            else if (c >= 'a' && c <= 'f') v = c - 'a' + 10;
            else if (c >= 'A' && c <= 'F') v = c - 'A' + 10;
            else continue;
            mac = (mac << 4) | v;
            digits++;
          }
          if (digits != 12) {
            ESP_LOGI("bms", "BMS MAC not set at runtime, using firmware default");
            return;
          }
          ESP_LOGW("bms", "Switching Daly BMS to %s", s.c_str());
          id(bms_client).set_enabled(false);
          id(bms_client).set_address(mac);
          id(bms_client).set_enabled(true);

text:
  - platform: template
    id: bms_mac
    name: "BMS MAC"
    icon: mdi:bluetooth-settings
    entity_category: config
    mode: text
    min_length: 0
    max_length: 17
    optimistic: true
    restore_value: true
    initial_value: ""
    on_value:
      - script.execute: bms_apply_mac

binary_sensor:
  - platform: daly_bms_ble
    daly_bms_ble_id: bms0
    online_status:
      id: bms_online
      name: "BMS Online Status"
    balancing:
      name: "BMS Balancing"
    charging:
      name: "BMS Charging"
    discharging:
      name: "BMS Discharging"

switch:
  - platform: ble_client
    ble_client_id: bms_client
    id: bms_ble_switch
    name: "BMS Bluetooth Connection"
    icon: mdi:bluetooth-connect

button:
  - platform: daly_bms_ble
    daly_bms_ble_id: bms0
    retrieve_settings:
      name: "BMS Retrieve Settings"
    retrieve_version:
      name: "BMS Retrieve Version"

.energy_defaults: &energy_defaults
  restore: true
  unit_of_measurement: kWh
  device_class: energy
  state_class: total_increasing
  accuracy_decimals: 3
  filters:
    - multiply: 0.001

sensor:
  - platform: daly_bms_ble
    daly_bms_ble_id: bms0
    state_of_charge:
      id: bms_soc
      name: "BMS State Of Charge"
    total_voltage:
      id: bms_total_voltage
      name: "BMS Total Voltage"
    current:
      id: bms_current
      name: "BMS Current"
    power:
      id: bms_power
      name: "BMS Power"
    charging_power:
      id: bms_charging_power
      name: "BMS Charging Power"
    discharging_power:
      id: bms_discharging_power
      name: "BMS Discharging Power"
    capacity_remaining:
      name: "BMS Capacity Remaining"
    charging_cycles:
      name: "BMS Charging Cycles"
    min_cell_voltage:
      id: bms_min_cell_voltage
      name: "BMS Min Cell Voltage"
    max_cell_voltage:
      id: bms_max_cell_voltage
      name: "BMS Max Cell Voltage"
    min_voltage_cell:
      name: "BMS Min Voltage Cell"
    max_voltage_cell:
      name: "BMS Max Voltage Cell"
    delta_cell_voltage:
      id: bms_delta_cell_voltage
      name: "BMS Delta Cell Voltage"
    average_cell_voltage:
      name: "BMS Average Cell Voltage"
    temperature_1:
      id: bms_temp1
      name: "BMS Temperature Sensor 1"
    temperature_2:
      id: bms_temp2
      name: "BMS Temperature Sensor 2"
    mosfet_temperature:
      name: "BMS Mosfet Temperature"
    cell_voltage_1:
      name: "BMS Cell Voltage 1"
    cell_voltage_2:
      name: "BMS Cell Voltage 2"
    cell_voltage_3:
      name: "BMS Cell Voltage 3"
    cell_voltage_4:
      name: "BMS Cell Voltage 4"
    cell_voltage_5:
      name: "BMS Cell Voltage 5"
    cell_voltage_6:
      name: "BMS Cell Voltage 6"
    cell_voltage_7:
      name: "BMS Cell Voltage 7"
    cell_voltage_8:
      name: "BMS Cell Voltage 8"
    cell_voltage_9:
      name: "BMS Cell Voltage 9"
    cell_voltage_10:
      name: "BMS Cell Voltage 10"
    cell_voltage_11:
      name: "BMS Cell Voltage 11"
    cell_voltage_12:
      name: "BMS Cell Voltage 12"
    cell_voltage_13:
      name: "BMS Cell Voltage 13"
    cell_voltage_14:
      name: "BMS Cell Voltage 14"
    cell_voltage_15:
      name: "BMS Cell Voltage 15"
    cell_voltage_16:
      name: "BMS Cell Voltage 16"

  - platform: total_daily_energy
    name: "BMS Daily Charge Energy"
    power_id: bms_charging_power
    <<: *energy_defaults

  - platform: total_daily_energy
    name: "BMS Daily Discharge Energy"
    power_id: bms_discharging_power
    <<: *energy_defaults
