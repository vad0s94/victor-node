# Universal MQTT transport for any standard broker (local Mosquitto, EMQX, HiveMQ, etc.)
#
# Expects substitutions:
#   mqtt_broker, mqtt_port, mqtt_username, mqtt_password,
#   mqtt_prefix, discovery_prefix, mqtt_log_level, mqtt_reboot_timeout, node_name.

mqtt:
  id: mqtt_client
  broker: ${mqtt_broker}
  port: ${mqtt_port}
  username: ${mqtt_username}
  password: ${mqtt_password}
  client_id: ${node_name}-node
  topic_prefix: ${mqtt_prefix}
  discovery: true
  discovery_prefix: ${discovery_prefix}
  discovery_retain: true
  discovery_unique_id_generator: mac
  discovery_object_id_generator: device_name
  log_topic:
    topic: ${mqtt_prefix}/debug
    level: ${mqtt_log_level}
  keepalive: 30s
  reboot_timeout: ${mqtt_reboot_timeout}
  on_connect:
    - lambda: 'id(transport_connected) = true;'
  on_disconnect:
    - lambda: 'id(transport_connected) = false;'
