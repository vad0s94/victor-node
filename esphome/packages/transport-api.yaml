# Native Home Assistant API transport.
# Direct, zero-configuration local communication between ESPHome and Home Assistant.
# Home Assistant automatically discovers this node on the local network (mDNS).
#
# Expects substitutions: api_reboot_timeout (optional, default 15min).

api:
  reboot_timeout: ${api_reboot_timeout}
  on_client_connected:
    - lambda: 'id(transport_connected) = true;'
  on_client_disconnected:
    - lambda: 'id(transport_connected) = false;'
