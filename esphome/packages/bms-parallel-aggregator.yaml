# Aggregator for 2 parallel battery packs (Pack 1 and Pack 2).
#
# Combines telemetry from bms1_* and bms2_* into standard bms_* entities:
#   - bms_soc: Average SoC of active packs (or individual SoC if only one pack is online)
#   - bms_online: Online if at least one pack is connected
#   - bms_power: Sum of pack powers
#   - bms_charging_power / bms_discharging_power: Sum of charging / discharging power
#   - bms_current: Total combined DC current
#   - bms_total_voltage: Average bus voltage of active packs
#   - bms_pack_soc_delta: Absolute difference |bms1_soc - bms2_soc| (crucial for detecting imbalance)
#   - bms_min_cell_voltage: Lowest cell voltage across both packs
#   - bms_max_cell_voltage: Highest cell voltage across both packs
#   - bms_delta_cell_voltage: Delta between highest and lowest cell across the whole bank
#
# Uses YAML anchors for DRY attribute definitions.

.meas_power: &meas_power
  unit_of_measurement: W
  device_class: power
  state_class: measurement
  accuracy_decimals: 0

.meas_voltage: &meas_voltage
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
  accuracy_decimals: 2

.meas_cell: &meas_cell
  unit_of_measurement: V
  device_class: voltage
  state_class: measurement
  accuracy_decimals: 3

.meas_energy: &meas_energy
  restore: true
  unit_of_measurement: kWh
  device_class: energy
  state_class: total_increasing
  accuracy_decimals: 3
  filters:
    - multiply: 0.001

binary_sensor:
  - platform: template
    id: bms_online
    name: "BMS Online Status"
    device_class: connectivity
    lambda: |-
      return id(bms1_online).state || id(bms2_online).state;

  - platform: template
    id: bms_both_online
    name: "BMS Both Packs Online"
    device_class: connectivity
    lambda: |-
      return id(bms1_online).state && id(bms2_online).state;

sensor:
  - platform: template
    id: bms_soc
    name: "BMS State Of Charge"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      bool p1 = id(bms1_online).state && id(bms1_soc).has_state() && !std::isnan(id(bms1_soc).state);
      bool p2 = id(bms2_online).state && id(bms2_soc).has_state() && !std::isnan(id(bms2_soc).state);
      if (p1 && p2) return (id(bms1_soc).state + id(bms2_soc).state) / 2.0f;
      if (p1) return id(bms1_soc).state;
      if (p2) return id(bms2_soc).state;
      return NAN;

  - platform: template
    id: bms_pack_soc_delta
    name: "BMS Packs SOC Difference"
    unit_of_measurement: "%"
    icon: mdi:delta
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (id(bms1_online).state && id(bms2_online).state &&
          id(bms1_soc).has_state() && id(bms2_soc).has_state()) {
        return fabsf(id(bms1_soc).state - id(bms2_soc).state);
      }
      return NAN;

  - platform: template
    id: bms_power
    name: "BMS Power"
    <<: *meas_power
    lambda: |-
      float p = 0;
      bool any = false;
      if (id(bms1_online).state && id(bms1_power).has_state() && !std::isnan(id(bms1_power).state)) {
        p += id(bms1_power).state;
        any = true;
      }
      if (id(bms2_online).state && id(bms2_power).has_state() && !std::isnan(id(bms2_power).state)) {
        p += id(bms2_power).state;
        any = true;
      }
      return any ? p : NAN;

  - platform: template
    id: bms_charging_power
    name: "BMS Charging Power"
    <<: *meas_power
    lambda: |-
      float p = 0;
      bool any = false;
      if (id(bms1_online).state && id(bms1_charging_power).has_state() && !std::isnan(id(bms1_charging_power).state)) {
        p += id(bms1_charging_power).state;
        any = true;
      }
      if (id(bms2_online).state && id(bms2_charging_power).has_state() && !std::isnan(id(bms2_charging_power).state)) {
        p += id(bms2_charging_power).state;
        any = true;
      }
      return any ? p : NAN;

  - platform: template
    id: bms_discharging_power
    name: "BMS Discharging Power"
    <<: *meas_power
    lambda: |-
      float p = 0;
      bool any = false;
      if (id(bms1_online).state && id(bms1_discharging_power).has_state() && !std::isnan(id(bms1_discharging_power).state)) {
        p += id(bms1_discharging_power).state;
        any = true;
      }
      if (id(bms2_online).state && id(bms2_discharging_power).has_state() && !std::isnan(id(bms2_discharging_power).state)) {
        p += id(bms2_discharging_power).state;
        any = true;
      }
      return any ? p : NAN;

  - platform: template
    id: bms_current
    name: "BMS Current"
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      float c = 0;
      bool any = false;
      if (id(bms1_online).state && id(bms1_current).has_state() && !std::isnan(id(bms1_current).state)) {
        c += id(bms1_current).state;
        any = true;
      }
      if (id(bms2_online).state && id(bms2_current).has_state() && !std::isnan(id(bms2_current).state)) {
        c += id(bms2_current).state;
        any = true;
      }
      return any ? c : NAN;

  - platform: template
    id: bms_total_voltage
    name: "BMS Total Voltage"
    <<: *meas_voltage
    lambda: |-
      bool p1 = id(bms1_online).state && id(bms1_total_voltage).has_state() && !std::isnan(id(bms1_total_voltage).state);
      bool p2 = id(bms2_online).state && id(bms2_total_voltage).has_state() && !std::isnan(id(bms2_total_voltage).state);
      if (p1 && p2) return (id(bms1_total_voltage).state + id(bms2_total_voltage).state) / 2.0f;
      if (p1) return id(bms1_total_voltage).state;
      if (p2) return id(bms2_total_voltage).state;
      return NAN;

  - platform: template
    id: bms_min_cell_voltage
    name: "BMS Min Cell Voltage"
    <<: *meas_cell
    lambda: |-
      bool p1 = id(bms1_online).state && id(bms1_min_cell_voltage).has_state();
      bool p2 = id(bms2_online).state && id(bms2_min_cell_voltage).has_state();
      if (p1 && p2) return std::min(id(bms1_min_cell_voltage).state, id(bms2_min_cell_voltage).state);
      if (p1) return id(bms1_min_cell_voltage).state;
      if (p2) return id(bms2_min_cell_voltage).state;
      return NAN;

  - platform: template
    id: bms_max_cell_voltage
    name: "BMS Max Cell Voltage"
    <<: *meas_cell
    lambda: |-
      bool p1 = id(bms1_online).state && id(bms1_max_cell_voltage).has_state();
      bool p2 = id(bms2_online).state && id(bms2_max_cell_voltage).has_state();
      if (p1 && p2) return std::max(id(bms1_max_cell_voltage).state, id(bms2_max_cell_voltage).state);
      if (p1) return id(bms1_max_cell_voltage).state;
      if (p2) return id(bms2_max_cell_voltage).state;
      return NAN;

  - platform: template
    id: bms_delta_cell_voltage
    name: "BMS Delta Cell Voltage"
    unit_of_measurement: V
    icon: mdi:delta
    state_class: measurement
    accuracy_decimals: 3
    lambda: |-
      float mn = id(bms_min_cell_voltage).state;
      float mx = id(bms_max_cell_voltage).state;
      if (!std::isnan(mn) && !std::isnan(mx)) return mx - mn;
      return NAN;

  - platform: total_daily_energy
    name: "BMS Daily Charge Energy"
    power_id: bms_charging_power
    <<: *meas_energy

  - platform: total_daily_energy
    name: "BMS Daily Discharge Energy"
    power_id: bms_discharging_power
    <<: *meas_energy
