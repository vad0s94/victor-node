# Voltronic PI30 (Axpert, MPP Solar, EASun, SP-3200) + JK BMS (BLE) + Native Home Assistant API
# Universal profile for Voltronic-family inverters with JK BMS on local LAN.

substitutions:
  node_name: solar-voltronic
  friendly_name: "Solar Voltronic"
  area: "Solar"
  board: esp32dev
  led_pin: GPIO2

  # API Transport
  api_reboot_timeout: 15min

  # Inverter RS232 (MAX3232 TTL side)
  inverter_tx_pin: GPIO16
  inverter_rx_pin: GPIO17
  update_interval: 15s

  # JK BMS BLE
  bms_default_mac: "00:00:00:00:00:00"
  jk_bms_source: github://syssi/esphome-jk-bms@59c994e726c34b123e43eb0090736fd94706f0db
  bms_protocol: JK02_32S
  bms_throttle: 10s

packages:
  base: !include packages/base.yaml
  transport: !include packages/transport-api.yaml
  ota_remote: !include packages/ota-remote.yaml
  status_led: !include packages/status-led.yaml
  inverter: !include packages/inverter-pi30.yaml
  bms: !include packages/bms-jk-ble.yaml
