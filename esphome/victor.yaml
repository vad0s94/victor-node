# Victor remote node: Victor NM-ECO 6.2KW PLUS (Modbus 2341) + JK BMS over BLE,
# connected to Home Assistant through the flespi MQTT broker.
#
# Build:   ../tools/build.sh victor.yaml
# Flash:   USB first time, then local OTA (same LAN) or tools/ota-remote.sh.

substitutions:
  node_name: victor
  friendly_name: Victor
  area: "Дача"
  board: esp32dev                 # ESP32-WROOM-32U DevKit; use wemos_d1_mini32 for the D1 Mini ESP32
  led_pin: GPIO2

  # MQTT layout (must match mosquitto/flespi-bridge.conf and the flespi token ACL)
  mqtt_prefix: victor/node
  discovery_prefix: victor/ha
  mqtt_log_level: WARN

  # Inverter (aver-ua package variables). TX/RX are ESP pins towards MAX3232 TTL side;
  # swap them if the inverter does not answer.
  inverter_tx_pin: GPIO16
  inverter_rx_pin: GPIO17
  inverter_voltage_offset: "0"
  update_interval: 15s
  select_skip_updates: "2"
  modbus_write_multiple: "false"

  # JK-B1A24S15P, HW 11.x
  bms_default_mac: "C8:47:80:00:00:00"   # placeholder; set the real one via the "BMS MAC" text entity
  jk_bms_source: github://syssi/esphome-jk-bms@59c994e726c34b123e43eb0090736fd94706f0db
  bms_protocol: JK02_32S
  bms_throttle: 10s

packages:
  base: !include packages/base.yaml
  mqtt: !include packages/mqtt-flespi.yaml
  ota_remote: !include packages/ota-remote.yaml
  status_led: !include packages/status-led.yaml
  inverter: !include packages/inverter-powmr-2341.yaml
  bms: !include packages/bms-jk-ble.yaml
  rules: !include packages/rules-soc.yaml
  # Optional cabinet temperature probe (DS18B20 on GPIO4):
  # temperature: !include packages/temp-ds18b20.yaml
