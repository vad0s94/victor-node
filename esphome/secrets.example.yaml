# Copy to secrets.yaml (git-ignored) and fill in.

# Wi-Fi: the node tries every network it sees, strongest first.
wifi_home_ssid: "home-ssid"
wifi_home_password: "home-password"
# Remote site network. Leave the placeholder if unknown: the user can
# enter it through the "Victor Setup" hotspot (captive portal) on site.
wifi_remote_ssid: "remote-ssid"
wifi_remote_password: "remote-password"

# Fallback hotspot that appears when no known Wi-Fi is reachable.
ap_password: "change-me-8chars"

# Local OTA (USB-less flashing while the node is on the same LAN).
ota_password: "change-me"

# Web page on the node (http://<node-ip>/) for the person on site.
web_username: "admin"
web_password: "change-me"

# flespi token "victor-node" (MQTT ACL token, topic victor/#).
# flespi uses the bare token (without the "FlespiToken " prefix) as the MQTT
# username; password stays empty.
flespi_token: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
