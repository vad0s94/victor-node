# Home Mosquitto (Home Assistant add-on) <-> flespi bridge for the Victor node.
# Based on flespi's guide: https://flespi.com/kb/mosquitto-flespi-mqtt-bridge
#
# Install: copy to /share/mosquitto/flespi-bridge.conf on Home Assistant and
# enable "customize" in the Mosquitto add-on (tools/ha-enable-bridge.sh does both).
# Replace HOME_BRIDGE_TOKEN with the flespi token "home-bridge" (ACL: victor/#).

connection flespi
address mqtt.flespi.io:8883
bridge_protocol_version mqttv50
remote_username HOME_BRIDGE_TOKEN
remote_clientid ha-home-bridge
# Mosquitto 2.1+: trust the container's system CA store (flespi uses GlobalSign).
bridge_tls_use_os_certs true
bridge_insecure false
try_private false
cleansession true
keepalive_interval 60
restart_timeout 10 120
start_type automatic
notifications true
notifications_local_only true
notification_topic victor/bridge/state

# Node state and commands, both directions:
#   victor/node/...  (remote) <-> victor/node/...  (home)
topic node/# both 1 victor/ victor/

# Home Assistant MQTT discovery of the node, cloud -> home only:
#   victor/ha/<component>/victor/<object>/config -> homeassistant/<component>/victor/<object>/config
topic +/victor/# in 1 homeassistant/ victor/ha/

# Home Assistant birth message, home -> cloud, so the node re-sends discovery
# after an HA restart:  homeassistant/status -> victor/ha/status
topic status out 1 homeassistant/ victor/ha/
